<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course - Chuah Learning App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="dashboard.html" class="logo">📚 Chuah Learning</a>
    </div>
    <div class="header-right">
      <a href="dashboard.html" class="header-nav-link">← Back to Dashboard</a>
      <a href="admin-settings.html" class="header-nav-link">⚙️ Settings</a>
      <button class="btn btn-secondary" id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="container" style="max-width: 1200px; padding: 40px 20px;">
    <div id="loading" class="text-center" style="display: none; padding: 40px;">
      <div class="spinner"></div>
      <p style="margin-top: 16px; color: #64748b;">Loading course...</p>
    </div>

    <div id="course-content" style="display: none;">
      <!-- Course Overview -->
      <div class="card" style="margin-bottom: 30px;">
        <h1 id="course-title"></h1>
        <div style="margin-top: 16px;">
          <p><strong>Goal:</strong> <span id="course-goal"></span></p>
          <p style="margin-top: 8px;"><strong>Timeline:</strong> <span id="course-timeline"></span></p>
          <div style="margin-top: 16px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <strong>Progress:</strong>
              <div class="progress-bar" style="flex: 1; max-width: 300px;">
                <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
              </div>
              <span id="progress-text">0%</span>
            </div>
          </div>
        </div>
        <div style="margin-top: 20px;">
          <button class="btn btn-primary" id="generate-structure-btn" style="display: none;">Generate Course Structure</button>
          <button class="btn btn-primary" id="add-module-btn" style="display: none; margin-left: 12px;">➕ Add Module</button>
          <button class="btn btn-danger" id="delete-course-btn" style="margin-left: 12px;">Delete Course</button>
        </div>
      </div>

      <!-- Modules List -->
      <div id="modules-container">
        <!-- Modules will be loaded here -->
      </div>
    </div>

    <div id="error-message" class="alert alert-error hidden"></div>
    <div id="success-message" class="alert alert-success hidden"></div>
  </main>

  <!-- Add Module Modal -->
  <div id="add-module-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Module</h2>
        <button class="modal-close" id="close-module-modal">&times;</button>
      </div>
      <form id="add-module-form">
        <div class="form-group">
          <label class="form-label" for="module-title">Module Title *</label>
          <input type="text" id="module-title" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="module-description">Description (Optional)</label>
          <textarea id="module-description" class="form-input" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-module-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Module</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Topic Modal -->
  <div id="add-topic-modal" class="modal hidden">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h2>Add New Topic</h2>
        <button class="modal-close" id="close-topic-modal">&times;</button>
      </div>
      <form id="add-topic-form">
        <input type="hidden" id="topic-module-id">
        <div class="form-group">
          <label class="form-label" for="topic-title">Topic Title *</label>
          <input type="text" id="topic-title" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="topic-content">Topic Content *</label>
          <div style="position: relative;">
            <div 
              id="topic-content-editor" 
              contenteditable="true" 
              style="
                min-height: 300px; 
                max-height: 500px; 
                overflow-y: auto;
                padding: 12px;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                background: white;
                font-family: inherit;
                font-size: 14px;
                line-height: 1.6;
              "
              placeholder="Paste your topic content here (text, images, etc.)..."
            ></div>
            <small style="color: #64748b; font-size: 12px; display: block; margin-top: 8px;">
              💡 Tip: You can paste content with images directly here. Use Ctrl+V (or Cmd+V on Mac) to paste.
            </small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-topic-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Topic & Enhance Content</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/course.js"></script>
</body>
</html>
